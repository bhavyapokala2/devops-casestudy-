<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkLite — Log in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="LinkLite home">
            <span class="brand-mark" aria-hidden="true">↗</span>
            <span>LinkLite</span>
        </a>
        <div class="header-actions">
            <a class="login-link" href="{{ url_for('login') }}">Log in</a>
            <a class="header-button" href="{{ url_for('signup') }}">Create account</a>
        </div>
    </header>

    <main class="page-shell auth-shell">
        <section class="auth-card" aria-label="Login page">
            <h2>Welcome back</h2>
            <p>Use your email or username to log in.</p>

            <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                <label for="email_or_username">Email or username</label>
                <input type="text" id="email_or_username" name="email_or_username" placeholder="name@example.com or username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit" class="premium-button auth-submit">Log in</button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
        </section>
    </main>
</body>
</html>
