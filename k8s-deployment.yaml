
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
        - name: url-shortener
          image: bhavyasrip/url-shortener:1.0
          
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://host.docker.internal:27017/"
            - name: DATABASE_NAME
              value: "url_shortener"
            - name: FLASK_SECRET_KEY
              value: "devops-demo-secret"
